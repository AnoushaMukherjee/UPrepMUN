<!DOCTYPE html>
<html>
<head>
    <style>
    body {
        background-color: rgb(255, 255, 255);
        font-family: 'Segoe UI', sans-serif;
        margin: 0;
        padding: 0;
    }
    h1, h2 {
        color: rgb(5, 96, 135);
        text-align: center;
        font-family: 'Trebuchet MS', sans-serif;
    }
    h2 {
        font-size: 2vw;
        margin: 1% 0;
    }
    nav {
        background-color: rgb(0, 127, 101);
        text-align: center;
        padding: 1%;
    }
    ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
    }
    li {
        display: inline-block;
        margin-right: 2%;
    }
    li a {
        color: white;
        text-decoration: none;
        font-size: medium;
        padding: 10px 20px;
    }
    .container {
        margin: 0;
        padding: 0;
    }
    .slideshow-container {
        position: relative;
        max-width: 80%;
        margin: auto;
        text-align: center;
    }
    .slide {
        display: none;
    }
    .slide img {
        width: 50%;
    }
    .prev, .next {
        position: absolute;
        top: 50%;
        padding: 16px;
        color: white;
        font-weight: bold;
        font-size: 18px;
        background-color: rgba(0, 0, 0, 0.5);
        border: none;
        cursor: pointer;
        border-radius: 50%;
        user-select: none;
        transform: translate(0, -50%);
    }
    .prev { left: 0; }
    .next { right: 0; }
    </style>
    <title>UPrep MUN</title>
</head>
<body>
    <nav>
        <ul>
            <li><a href="/templates/index.html">HOME</a></li>
            <li><a href="/templates/about.html">ABOUT</a></li>
            <li><a href="/templates/registration.html">REGISTRATION</a></li>
            <li><a href="/templates/committees.html">COMMITTEES</a></li>
            <li><a href="/templates/contact.html">CONTACT</a></li>
        </ul>
    </nav>
    <div class="container">
        <h2><b>Welcome to the 2nd UPrep MUN Conference!</b></h2>
        <h2><b>UPrep MUN will be held on May 16th, 2025</b></h2>
    </div>
    <div class="slideshow-container">
        <div class="slide"><img src="/static/media1.jpg"></div>
        <div class="slide"><img src="/static/media2.jpg"></div>
        <div class="slide"><img src="/static/media3.jpg"></div>
        <div class="slide"><img src="/static/media4.jpg"></div>
        <div class="slide"><img src="/static/media5.jpg"></div>
        <div class="slide"><img src="/static/media6.jpg"></div>
        <div class="slide"><img src="/static/media7.jpg"></div>
        <div class="slide"><img src="/static/media8.jpg"></div>
        
        <button class="prev" onclick="plusSlides(-1)">&#10094;</button>
        <button class="next" onclick="plusSlides(1)">&#10095;</button>
    </div>
    <script>
        let slideIndex = 0;
        function showSlides() {
            let slides = document.getElementsByClassName("slide");
            if (slideIndex >= slides.length) { slideIndex = 0; }
            if (slideIndex < 0) { slideIndex = slides.length - 1; }
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            slides[slideIndex].style.display = "block";
        }
        function plusSlides(n) {
            slideIndex += n;
            showSlides();
        }
        document.addEventListener("DOMContentLoaded", showSlides);
    </script>
</body>
</html>
